
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Accessible Web Page</title>
</head>

<body>

    <a href="#main-content">Skip to Main Content</a>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <nav aria-label="Main Navigation">
        <a href="#home">Home</a> |
        <a href="#about">About</a> |
        <a href="#contact">Contact</a>
    </nav>

    <main id="main-content">

        <section id="home">
            <h2>Home</h2>
            <p>Welcome to my accessible webpage.</p>

            <img src="https://placehold.co/300x200"
                 alt="A sample placeholder image"
                 width="300"
                 height="200">
        </section>

        <section id="about">
            <h2>About Us</h2>
            <p>This webpage uses HTML accessibility features.</p>
        </section>

        <section id="contact">
            <h2>Contact Us</h2>
            <p>Email: student@example.com</p>
        </section>

    </main>

    <footer>
        <p>Copyright &copy; 2026 My Website</p>
    </footer>

</body>
</html>
