
<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks and Images</title>
</head>

<body>

    <h1>Hyperlinks and Images in HTML</h1>

    <h2>1. Internal Link</h2>
    <a href="#about">Go to About Section</a>

    <h2>2. External Link</h2>
    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>

    <h2>3. Email Link</h2>
    <a href="mailto:example@gmail.com">
        Send an Email
    </a>

    <h2>4. Image with Attributes</h2>

    <img src="https://placehold.co/300x200"
         alt="Sample placeholder image"
         width="300"
         height="200">

    <h2 id="about">About Section</h2>
    <p>
        This is the about section of my webpage.
        The internal link takes the user directly here.
    </p>

</body>
</html>
